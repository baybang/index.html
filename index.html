<meta charset="UTF-8"/>

<title>Bay Bang IPSports</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060810;--sur:#0d1221;--sur2:#141b2d;
  --bor:rgba(255,255,255,0.06);
  --blue:#1a4fd6;--blue2:#4a7aff;
  --red:#e63946;--text:#eef0f4;--muted:#4e5a78;
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;
  display:grid;
  grid-template-rows:54px 1fr;
  grid-template-columns:290px 1fr;
  grid-template-areas:"hdr hdr" "side main";
}
header{
  grid-area:hdr;background:var(--sur);border-bottom:1px solid var(--bor);
  display:flex;align-items:center;gap:12px;padding:0 16px;
}
.brand{
  font-family:'Oswald',sans-serif;font-size:19px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;white-space:nowrap;
  color:var(--blue2);display:flex;align-items:center;gap:8px;
}
.brand em{color:#fff;font-style:normal}
.search{flex:1;max-width:240px;position:relative}
.search input{
  width:100%;background:var(--sur2);border:1px solid var(--bor);
  border-radius:7px;color:var(--text);font-size:13px;
  padding:7px 12px 7px 32px;outline:none;font-family:'Inter',sans-serif;
  transition:border-color .2s;
}
.search input:focus{border-color:var(--blue2)}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);opacity:.35;pointer-events:none}
.ltabs{display:flex;gap:4px}
.ltab{
  background:transparent;border:1px solid var(--bor);border-radius:6px;
  color:var(--muted);font-size:12px;padding:5px 11px;cursor:pointer;
  font-family:'Inter',sans-serif;transition:all .15s;white-space:nowrap;
}
.ltab:hover{color:var(--text);background:var(--sur2)}
.ltab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.hstat{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.live{background:#22c55e;animation:blink 1.5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
aside{
  grid-area:side;background:var(--sur);border-right:1px solid var(--bor);
  display:flex;flex-direction:column;overflow:hidden;
}
.shead{
  padding:10px 14px;font-family:'Oswald',sans-serif;font-size:10px;
  letter-spacing:2px;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--bor);
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0;
}
.sbadge{background:var(--blue);color:#fff;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700}
.clist{overflow-y:auto;flex:1}
.clist::-webkit-scrollbar{width:3px}
.clist::-webkit-scrollbar-thumb{background:var(--sur2);border-radius:2px}
.ci{
  display:flex;align-items:center;gap:10px;padding:10px 13px;
  cursor:pointer;border-bottom:1px solid var(--bor);transition:background .1s;
}
.ci:hover{background:var(--sur2)}
.ci.on{background:rgba(26,79,214,.2);border-left:3px solid var(--blue2);padding-left:10px}
.ci-logo{
  width:40px;height:40px;border-radius:7px;background:var(--sur2);
  border:1px solid var(--bor);display:flex;align-items:center;
  justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;
}
.ci-logo img{width:100%;height:100%;object-fit:contain;border-radius:6px;padding:3px}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-sub{font-size:11px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.ltag{
  font-size:9px;font-weight:700;letter-spacing:.4px;
  background:rgba(74,122,255,.12);color:var(--blue2);
  border:1px solid rgba(74,122,255,.25);border-radius:3px;
  padding:1px 5px;text-transform:uppercase;flex-shrink:0;
}
.nores{padding:32px 14px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}
main{grid-area:main;display:flex;flex-direction:column;background:#000;overflow:hidden}
.vwrap{flex:1;position:relative;display:flex;align-items:center;justify-content:center;background:#000}
video{width:100%;height:100%;object-fit:contain;display:block}
.ov{
  position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;
  background:rgba(6,8,16,.9);text-align:center;padding:24px;
}
.ov.show{display:flex}
.ov-ico{font-size:60px;margin-bottom:16px;line-height:1}
.ov-h{
  font-family:'Oswald',sans-serif;font-size:22px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;color:var(--blue2);margin-bottom:8px;
}
.ov-p{font-size:13px;color:var(--muted);max-width:320px;line-height:1.65}
.spin{
  width:44px;height:44px;border:3px solid rgba(74,122,255,.15);
  border-top-color:var(--blue2);border-radius:50%;
  animation:spin .7s linear infinite;margin-bottom:16px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.npbar{
  background:var(--sur);border-top:1px solid var(--bor);
  padding:9px 16px;display:none;align-items:center;gap:12px;flex-shrink:0;
}
.npbar.show{display:flex}
.np-ico{
  width:32px;height:32px;border-radius:5px;background:var(--sur2);
  border:1px solid var(--bor);display:flex;align-items:center;
  justify-content:center;font-size:16px;flex-shrink:0;overflow:hidden;
}
.np-ico img{width:100%;height:100%;object-fit:contain;border-radius:4px;padding:2px}
.np-info{flex:1}
.np-name{font-family:'Oswald',sans-serif;font-size:15px;font-weight:600;letter-spacing:.5px}
.np-sub{font-size:11px;color:var(--muted);margin-top:1px}
.livepill{
  background:var(--red);color:#fff;font-size:10px;font-weight:700;
  letter-spacing:1px;padding:3px 10px;border-radius:4px;text-transform:uppercase;flex-shrink:0;
}
@media(max-width:680px){
  body{
    grid-template-rows:54px 200px 1fr;grid-template-columns:1fr;
    grid-template-areas:"hdr" "side" "main";overflow:auto;height:auto;
  }
  html,body{height:auto}
  main{min-height:250px}
  .ltabs,.hstat{display:none}
}
</style>

// ── STATE ──────────────────────────────────────────────────
let lang="all", activeIdx=-1, hlsObj=null;

function vis(){
  const q=document.getElementById("srch").value.toLowerCase().trim();
  return CH.filter(c=>{
    const lok=lang==="all"||c.lang===lang;
    const qok=!q||c.name.toLowerCase().includes(q)||c.country.toLowerCase().includes(q);
    return lok&&qok;
  });
}

function render(){
  const list=vis();
  document.getElementById("cnt").textContent=list.length;
  const el=document.getElementById("clist");
  el.innerHTML="";
  if(!list.length){el.innerHTML='<div class="nores">No channels found.</div>';return;}
  list.forEach((c,i)=>{
    const d=document.createElement("div");
    d.className="ci"+(i===activeIdx?" on":"");
    d.innerHTML=`
      <div class="ci-logo">${c.logo
        ?`<img src="${c.logo}" onerror="this.parentNode.textContent='📺'" loading="lazy"/>`
        :c.flag}</div>
      <div class="ci-info">
        <div class="ci-name">${c.name}</div>
        <div class="ci-sub">${c.flag} ${c.country} <span class="ltag">${c.lang.toUpperCase()}</span></div>
      </div>`;
    d.onclick=()=>play(i,list);
    el.appendChild(d);
  });
}

// ── GET STREAM: try iptv-org raw → proxy → fallback ────────
async function getStream(c){
  // 1. Try fetching iptv-org raw M3U via proxy (no CORS issue)
  const rawUrl = M3U_BASE + c.id + ".m3u";
  const proxiedRaw = PROXY + encodeURIComponent(rawUrl);
  try {
    const r = await fetch(proxiedRaw, {cache:"no-store"});
    if(r.ok){
      const txt = await r.text();
      for(const line of txt.split("\n")){
        const t=line.trim();
        if(t && !t.startsWith("#")) {
          // Return the stream URL wrapped in our proxy
          return PROXY + encodeURIComponent(t);
        }
      }
    }
  } catch(e){}

  // 2. Use hardcoded fallback via proxy
  if(c.fallback) return PROXY + encodeURIComponent(c.fallback);
  return null;
}

// ── PLAY ───────────────────────────────────────────────────
async function play(idx, list){
  list = list || vis();
  activeIdx = idx;
  render();
  const c = list[idx];
  showOv("l");
  document.getElementById("lname").textContent = `Loading ${c.name}…`;
  setSt(c.name, false);
  updateNP(c);

  const url = await getStream(c);
  if(!url){ showOv("e"); document.getElementById("errmsg").textContent="No stream found for this channel."; setSt("Offline",false); return; }

  if(hlsObj){ hlsObj.destroy(); hlsObj=null; }
  const vid = document.getElementById("vid");
  vid.removeAttribute("src");

  const onOK  = () => { hideOv(); setSt(c.name, true); };
  const onFail= () => { showOv("e"); document.getElementById("errmsg").textContent="Stream is geo-restricted or offline."; setSt("Error",false); };

  if(Hls.isSupported()){
    hlsObj = new Hls({enableWorker:false, maxBufferLength:20, maxLoadingDelay:10});
    hlsObj.loadSource(url);
    hlsObj.attachMedia(vid);
    hlsObj.on(Hls.Events.MANIFEST_PARSED, () => {
      vid.play().then(onOK).catch(()=>hideOv());
    });
    hlsObj.on(Hls.Events.ERROR, (_,d) => { if(d.fatal) onFail(); });
  } else if(vid.canPlayType("application/vnd.apple.mpegurl")){
    vid.src = url;
    vid.onloadedmetadata = () => { hideOv(); vid.play(); setSt(c.name,true); };
    vid.onerror = onFail;
  } else {
    vid.src = url;
    vid.oncanplay = onOK;
    vid.onerror = onFail;
    vid.play().catch(()=>{});
  }
}

function updateNP(c){
  document.getElementById("npbar").className="npbar show";
  document.getElementById("np-ico").innerHTML=c.logo
    ?`<img src="${c.logo}" onerror="this.parentNode.textContent='📺'" style="width:100%;height:100%;object-fit:contain"/>`
    :c.flag;
  document.getElementById("np-name").textContent=c.name;
  document.getElementById("np-sub").textContent=`${c.flag} ${c.country} · ${langLabel(c.lang)}`;
}
function showOv(id){
  ["w","l","e"].forEach(x=>document.getElementById("ov-"+x).classList.remove("show"));
  document.getElementById("ov-"+id).classList.add("show");
}
function hideOv(){
